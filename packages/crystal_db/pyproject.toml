[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-db"
version = "0.1.0"
description = "Portable crystal structure retrieval and CSP-evidence subsystem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Christian Browning" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
schema = ["jsonschema>=4"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
crystal-db-mcp = "crystal_db.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crystal_db = ["schemas/*.json", "configs/*.json"]
