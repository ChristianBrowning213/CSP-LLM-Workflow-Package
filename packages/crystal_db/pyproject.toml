[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-db"
version = "0.2.0.dev0+fidelity"
description = "Source-faithful Crystal-DB software system."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Christian Browning" }]
dependencies = [
    "monty",
    "pymatgen",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
schema = ["jsonschema>=4"]
reporting = ["matplotlib"]
acquisition = ["mp-api", "robocrys"]
test = ["pytest>=8", "jsonschema>=4", "matplotlib", "robocrys"]

[project.scripts]
crystal-db = "crystal_db.__main__:main"
crystal-db-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crystal_db = ["schemas/*.json", "configs/*.json", "configs/*.yaml"]
