[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlip"
version = "0.1.0"
description = "Quantum lattice integer programming solver for LLM-CSP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vladimir V. Gusev" },
    { name = "Christian Browning" },
]
dependencies = [
    "ase",
    "gurobipy",
    "jsonschema>=4",
    "numpy",
    "pymatgen",
    "pyomo",
    "scipy",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
test = ["mcp>=1.0,<2", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qlip = [
    "resources/*.json",
    "resources/base/*.json",
    "resources/schemas/*.json",
    "resources/spp/*/*.POT",
]
