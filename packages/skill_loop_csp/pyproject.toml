[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sok-llm-orchestrator"
version = "0.1.0"
description = "Non-SoK orchestrator for CrystalDB, SPP, and QLIP"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
sokllm = "sok_llm_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -p no:tmpdir"
markers = [
  "live_llm: tests that hit a real local LLM endpoint",
  "live_e2e: tests that hit real local LLM plus real MCP servers end-to-end",
]

[tool.ruff]
line-length = 100
