[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-csp"
version = "0.1.0"
description = "A retrieval-guided, solver-backed crystal structure prediction framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "packages/qlip/LICENSE"]
authors = [{ name = "Christian Browning" }]
dependencies = [
    "ase==3.27.0",
    "mendeleev==1.1.0",
    "numpy>=1.26",
    "pymatgen==2026.5.4",
    "pymatgen-core==2026.8.30",
    "pyomo",
    "PyYAML>=6.0",
    "scipy",
    "smact==4.0.0",
    "gurobipy",
    "jsonschema>=4",
]

[project.scripts]
llm-csp = "llm_csp.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src", "packages/qlip/src", "packages/crystal_db/src"]

[tool.setuptools.package-data]
qlip = [
    "resources/base/*.json",
    "resources/schemas/*.json",
]
crystal_db = ["schemas/*.json", "configs/*.json"]

[tool.pytest.ini_options]
markers = [
    "requires_external_scientific_assets: optional scientific E2E requiring a lawful user POT root",
]
