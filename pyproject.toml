[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-csp"
version = "0.1.0"
description = "A retrieval-guided, solver-backed crystal structure prediction framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "packages/qlip/LICENSE"]
authors = [{ name = "Christian Browning" }]
dependencies = [
    "ase>=3.22",
    "numpy>=1.26",
    "pymatgen",
    "pyomo",
    "PyYAML>=6.0",
    "scipy",
    "gurobipy",
    "jsonschema>=4",
]

[project.scripts]
llm-csp = "llm_csp.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=1.0,<2"]
validation = [
    "sca @ git+https://github.com/ChristianBrowning213/Structured_Crystal_Analyser.git@e5b291312151f34949a5e6ef0f43bebfeb752bc9",
]

[tool.setuptools.packages.find]
where = ["src", "packages/qlip/src", "packages/crystal_db/src"]

[tool.setuptools.package-data]
qlip = [
    "resources/*.json",
    "resources/base/*.json",
    "resources/schemas/*.json",
    "resources/spp/*/*.POT",
]
crystal_db = ["schemas/*.json", "configs/*.json"]
