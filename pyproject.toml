[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-csp"
version = "0.2.0.dev0+fidelity"
description = "A retrieval-guided, solver-backed crystal structure prediction framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Browning" }]
dependencies = [
    "click>=8",
    "pandas>=2",
    "rich>=13",
    "typer>=0.12,<0.25",
    "ase==3.27.0",
    "mendeleev==1.1.0",
    "numpy>=1.26",
    "pymatgen==2026.5.4",
    "pymatgen-core==2026.8.30",
    "pyomo",
    "PyYAML>=6.0",
    "scipy",
    "smact==4.0.0",
    "gurobipy",
    "jsonschema>=4",
]

[project.scripts]
llm-csp = "llm_csp.cli.main:main"
crystal-db = "crystal_db.__main__:main"
crystal-db-mcp = "mcp_server.server:main"
spp-maker = "spp_maker.cli:main"
spp-maker-mcp = "spp_maker_mcp.server:main"
sca = "sca.cli:app"
sokllm = "sok_llm_orchestrator.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=1.0,<2", "matplotlib", "robocrys"]
validation = [
    "pydantic>=2",
    "tqdm>=4.60",
]

[tool.setuptools.packages.find]
# The Skill-Loop tree also carries a historical spp_maker_qlip compatibility
# package. Discover the authoritative SPP-Maker tree last so setuptools maps
# that duplicate namespace to the complete source package.
where = ["src", "packages/qlip/src", "packages/crystal_db/src", "packages/sca", "packages/skill_loop_csp/src", "packages/spp_maker_qlip/src"]

[tool.setuptools.package-data]
qlip = [
    "resources/base/*.json",
    "resources/schemas/*.json",
    "interactions/SPP/SPP/*/*.POT",
]
crystal_db = ["schemas/*.json", "configs/*.json", "configs/*.yaml"]
sok_llm_orchestrator = [
    "agentic/prompts/*.md",
    "retrieval/corpus_registry.json",
    "skills/*.json",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "requires_external_scientific_assets: optional scientific E2E requiring a lawful user POT root",
]
